<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | Elite AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      color: white;
      background: #030712;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(37, 99, 235, .35),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(124, 58, 237, .35),
          transparent 35%
        );
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .logo span {
      color: #60a5fa;
    }

    .card {
      padding: 35px;
      border-radius: 25px;

      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);

      backdrop-filter: blur(20px);

      box-shadow:
        0 25px 80px rgba(0,0,0,.35);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #9ca9bf;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;

      border-radius: 12px;

      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.05);

      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.1);
    }

    button {
      width: 100%;
      margin-top: 25px;

      padding: 15px;

      border: none;
      border-radius: 12px;

      color: white;
      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      background:
        linear-gradient(
          90deg,
          #2563eb,
          #4f46e5,
          #7c3aed
        );
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #f87171;
    }

    .bottom {
      margin-top: 25px;
      text-align: center;
      color: #9ca9bf;
      font-size: 14px;
    }

    .bottom a {
      color: #60a5fa;
      text-decoration: none;
    }

    .home {
      display: block;
      margin-top: 20px;
      text-align: center;

      color: #64748b;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ELITE<span>AI</span>
    </div>

    <div class="card">

      <h1>Create your account</h1>

      <p class="subtitle">
        Create your Elite AI account and start using
        your AI workspace.
      </p>

      <form id="registerForm">

        <label for="name">
          Full name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Your name"
          required
        >


        <label for="email">
          Email address
        </label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        >


        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="At least 6 characters"
          minlength="6"
          required
        >


        <button id="registerButton" type="submit">
          Create Account
        </button>

      </form>

      <div id="message" class="message"></div>

      <div class="bottom">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>

    <a href="index.html" class="home">
      ← Back to Elite AI
    </a>

  </div>
<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


  // YOUR FIREBASE CONFIGURATION
  const firebaseConfig = {
    apiKey: "AIzaSyDe32q2gPMSh0ARyx8QuXuC93YroTy5NqI",
    authDomain: "eliteai-by-attri.firebaseapp.com",
    projectId: "eliteai-by-attri",
    storageBucket: "eliteai-by-attri.firebasestorage.app",
    messagingSenderId: "876920924035",
    appId: "1:876920924035:web:be1e3cbfefe227d6ddb8b6"
   };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  const form = document.getElementById("registerForm");

  const button = document.getElementById("registerButton");

  const message = document.getElementById("message");


  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    button.disabled = true;

    button.textContent = "Creating account...";

    message.textContent = "";


    try {

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user = userCredential.user;


      await updateProfile(user, {
        displayName: name
      });


      await setDoc(
        doc(db, "users", user.uid),
        {
          email: email,
          displayName: name,
          avatarUrl: "",
          role: "user",
          plan: "free",
          subscriptionStatus: "inactive",
          dailySearches: 0,
          dailyImages: 0,
          createdAt: serverTimestamp()
        }
      );


      message.style.color = "#4ade80";

      message.textContent =
        "Account created successfully!";


      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 1000);


    } catch (error) {

      console.error(error);

      message.style.color = "#f87171";

      if (error.code === "auth/email-already-in-use") {

        message.textContent =
          "This email is already registered.";

      } else if (error.code === "auth/invalid-email") {

        message.textContent =
          "Please enter a valid email.";

      } else if (error.code === "auth/weak-password") {

        message.textContent =
          "Password must be at least 6 characters.";

      } else {

        message.textContent =
          "Something went wrong. Please try again.";

      }

    }


    button.disabled = false;

    button.textContent = "Create Account";

  });

</script>
</body>

</html>
